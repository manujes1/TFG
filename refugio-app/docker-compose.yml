services:
  postgres:
    image: postgres:16-alpine
    container_name: refugio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refugio
      POSTGRES_PASSWORD: refugio_dev_password
      POSTGRES_DB: refugio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refugio -d refugio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Perfil "ia": solo arranca con --profile ia, porque consume mucha memoria
  ollama:
    image: ollama/ollama:latest
    container_name: refugio-ollama
    restart: unless-stopped
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Perfil "app": docker compose --profile app up -d --build
  # Sin perfil solo arranca Postgres, para desarrollar con npm run dev

  auth:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    container_name: refugio-auth
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  animales:
    build:
      context: ./backend
      dockerfile: services/animales/Dockerfile
    container_name: refugio-animales
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  expedientes:
    build:
      context: ./backend
      dockerfile: services/expedientes/Dockerfile
    container_name: refugio-expedientes
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  fotos:
    build:
      context: ./backend
      dockerfile: services/fotos/Dockerfile
    container_name: refugio-fotos
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3004:3004"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  adopciones:
    build:
      context: ./backend
      dockerfile: services/adopciones/Dockerfile
    container_name: refugio-adopciones
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
      MATCHMAKING_URL: http://matchmaking:3011
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy

  apadrinamientos:
    build:
      context: ./backend
      dockerfile: services/apadrinamientos/Dockerfile
    container_name: refugio-apadrinamientos
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy

  donaciones:
    build:
      context: ./backend
      dockerfile: services/donaciones/Dockerfile
    container_name: refugio-donaciones
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy

  estadisticas:
    build:
      context: ./backend
      dockerfile: services/estadisticas/Dockerfile
    container_name: refugio-estadisticas
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy

  ia:
    build:
      context: ./backend
      dockerfile: services/ia/Dockerfile
    container_name: refugio-ia
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
      OLLAMA_URL: http://ollama:11434
      MATCHMAKING_URL: http://matchmaking:3011
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy

  recomendaciones:
    build:
      context: ./backend
      dockerfile: services/recomendaciones/Dockerfile
    container_name: refugio-recomendaciones
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://refugio:refugio_dev_password@postgres:5432/refugio_db?schema=public
      OLLAMA_URL: http://ollama:11434
      MATCHMAKING_URL: http://matchmaking:3011
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy

  matchmaking:
    build:
      context: ./backend
      dockerfile: services/matchmaking/Dockerfile
    container_name: refugio-matchmaking
    profiles: ["app"]
    env_file: ./backend/.env
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3011:3011"

  frontend:
    build: ./frontend
    container_name: refugio-frontend
    profiles: ["app"]
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  ollama-data:
