services:
  postgres:
    image: postgres:16-alpine
    container_name: refugio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: refugio
      POSTGRES_PASSWORD: refugio_dev_password
      POSTGRES_DB: refugio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refugio -d refugio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
